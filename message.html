<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Campus - Messages</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        /* Custom styles for the messages page */
        .conversation-list {
            height: 400px; /* Adjust as needed */
            overflow-y: scroll;
            border-right: 1px solid #dee2e6;
        }

        .conversation-item {
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
            cursor: pointer;
        }

        .conversation-item:hover {
            background-color: #f8f9fa;
        }

        .message-area {
            height: 400px; /* Adjust as needed */
            overflow-y: scroll;
            padding: 10px;
        }

        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .message.sent {
            background-color: #dcf8c6; /* Light green for sent messages */
            align-self: flex-end;
        }

        .message.received {
            background-color: #fff; /* White for received messages */
            align-self: flex-start;
        }

        .message-input-area {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar (same as before) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold" href="#">Social Campus</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <input class="form-control search-input" type="search" placeholder="Search posts, people, groups" style="width: 300px;">
                </div>
                <div class="navbar-nav">
                    <a class="nav-link text-white" href="index.html">Home</a>
                    <a class="nav-link text-white" href="profile.html">Profile</a>
                    <a class="nav-link text-white" href="message.html">Messages</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid main-content">
        <div class="row">

            <!-- Left Sidebar (same as before, but link to messages page) -->
            <div class="col-lg-3 col-md-4 left-sidebar">
                <div class="sidebar-content">
                    <!-- Profile Section -->
                    <div class="card mb-3">
                        <div class="card-body text-center">
                           <div class="profile-circle mb-2">
                                <img src="img/me.jpg" alt="Profile Picture" class="rounded-circle" width="50" height="50" style="object-fit: cover;">
                            </div>
                            <h6 class="card-title mb-1">Sharaine May C. Diotay</h6>
                            <small class="text-muted">BSIT - 3rd Year Student</small>
                        </div>
                    </div>
                    <!-- Navigation Menu -->
                    <div class="card">
                        <div class="list-group list-group-flush">
                            <a href="newsfeed.html" class="list-group-item list-group-item-action">News Feed</a>
                            <a href="profile.html" class="list-group-item list-group-item-action">My Profile</a>
                            <a href="message.html" class="list-group-item list-group-item-action active">Messages</a>
                            <a href="groups.html" class="list-group-item list-group-item-action">Groups</a>
                            <a href="events.html" class="list-group-item list-group-item-action">Events</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center Content (Messages) -->
            <div class="col-lg-6 col-md-8 center-content">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <!-- Conversation List -->
                            <div class="col-md-4 conversation-list">
                                <div class="conversation-item" data-conversation-id="1">
                                    <div class="d-flex align-items-center">
                                        <div class="profile-circle me-2">
                                            <img src="img/james.jpg" alt="Contact" class="rounded-circle" width="30" height="30" style="object-fit: cover;">
                                        </div>
                                        <span>James Rosellosa</span>
                                    </div>
                                </div>
                                <div class="conversation-item" data-conversation-id="2">
                                    <div class="d-flex align-items-center">
                                        <div class="profile-circle me-2">
                                            <img src="img/felipe.jpg" alt="Contact" class="rounded-circle" width="30" height="30" style="object-fit: cover;">
                                        </div>
                                        <span>Felipe De Los Reyes</span>
                                    </div>
                                </div>

                                    <div class="conversation-item" data-conversation-id="3">
                                    <div class="d-flex align-items-center">
                                        <div class="profile-circle me-2">
                                            <img src="img/felipe.jpg" alt="Contact" class="rounded-circle" width="30" height="30" style="object-fit: cover;">
                                        </div>
                                        <span>Sharaine May C. Diotay</span>
                                    </div>
                                </div>
                                <!-- Add more conversation items as needed -->
                            </div>

                            <!-- Message Area -->
                            <div class="col-md-8 message-area d-flex flex-column">
                                <div class="message received">
                                    Sha, diin ka?
                                </div>
                                <div class="message sent">
                                    ari ko lib james gapa aircon.
                                </div>
                                <!-- Add more messages as needed -->
                            </div>
                        </div>
                        <!-- Message Input Area -->
                        <div class="message-input-area">
                            <div class="input-group">
                                <input type="text" class="form-control" placeholder="Type your message...">
                                <button class="btn btn-primary" type="button">Send</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Sidebar (same as before) -->
            <div class="col-lg-3 d-none d-lg-block right-sidebar">
                <div class="sidebar-content">
                    <!-- Upcoming Events -->
                    <div class="card mb-3">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h6 class="mb-0">Upcoming</h6>
                            <small><a href="#" class="text-decoration-none">See all</a></small>
                        </div>
                        <div class="card-body">
                            <div class="d-flex align-items-start">
                                <div class="date-box me-3">
                                    <div class="date-month">Sep</div>
                                    <div class="date-day">30</div>
                                </div>
                                <div>
                                    <h6 class="mb-0">Study Jam</h6>
                                    <small class="text-muted">Sep 30, 2025<br>CICTE Lab • 2:00 PM</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        // Basic JavaScript to handle conversation selection (replace with actual logic)
        document.querySelectorAll('.conversation-item').forEach(item => {
            item.addEventListener('click', function() {
                const conversationId = this.dataset.conversationId;
                alert(`Selected conversation ${conversationId}`); // Replace with actual message loading logic
            });
        });
    </script>
</body>
</html>
